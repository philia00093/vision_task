# 手部 21 关键点数据集（YOLO Pose 格式）
# 标注工具：X-AnyLabeling 的手部关键点模板（21 点，与 MediaPipe 一致），
#           导出格式选 YOLO Pose。
# 用法：yolo pose train data=wersion_train/configs/data_hand_pose.yaml model=wersion_train/weights/yolo26n-pose.pt
#
# 重要：Ultralytics 没有官方"手部关键点"预训练权重。
#   官方 hand-keypoints 数据集（26k 张，COCO 格式，keypoints: 21）是要自己从头训练的；
#   权重表里的 yolo26n-pose.pt 是 COCO 人体 17 点姿态模型。
#   所以我们用 yolo26n-pose.pt 作预训练起点（主干/颈部特征可用，关键点头会按 21 点重建），
#   标注必须用 X-AnyLabeling 手工标，不能指望现成的手部关键点模型自动标。
#
# 目录约定：
#   wersion_train/datasets/hand_pose/
#     images/train/*.jpg   labels/train/*.txt     ← YOLO pose 标签（框 + 21×(x,y,v)）
#     images/val/*.jpg     labels/val/*.txt


kpt_shape: [21, 3]   # 21 个关键点，每个 (x, y, visible)

names:
  0: hand            # 手（含左右手同一类；若后面要区分左右，加 hand_left / hand_right 并同步改标签）

# 21 点顺序（MediaPipe 手部标准，X-AnyLabeling 模板同序）：
#   0 wrist
#   1 thumb_cmc        2 thumb_mcp        3 thumb_ip         4 thumb_tip
#   5 index_finger_mcp 6 index_finger_pip 7 index_finger_dip 8 index_finger_tip
#   9 middle_finger_mcp 10 middle_finger_pip 11 middle_finger_dip 12 middle_finger_tip
#   13 ring_finger_mcp 14 ring_finger_pip 15 ring_finger_dip 16 ring_finger_tip
#   17 pinky_mcp       18 pinky_pip       19 pinky_dip       20 pinky_tip
#
# 可见性 v：0=框外/未标，1=标了但被遮挡，2=清晰可见。
#   自遮挡的手指（比如抓取时）标 v=1，不要留 0，否则训练时会被当成缺失点。
#
# 训练提示：
#   · 手部关键点数据量需求远大于检测：起步建议 ≥ 1500 张，覆盖张开/捏取/握拳/侧向。
#   · 手势被零件遮挡的部分按 v=1 标，别硬猜坐标。
#   · pose 训练显存占用比检测高，8G 卡上 imgsz 先用 640、batch 8 试。

path: D:\wang_robot\3_1\version_task\vesion_task\wersion_train\datasets\hand_pose
train: images/train
val: images/val
