# 区域数据集：料盘区（左）/ 装配区（右）/ 手
# 标注工具：X-AnyLabeling，导出格式选 YOLO Detection（矩形框）
# 用法：yolo detect train data=wersion_train/configs/data_regions.yaml model=wersion_train/weights/yolo26n.pt
#
# 目录约定（X-AnyLabeling 的 images/ + labels/ 同名配对）：
#   wersion_train/datasets/regions/
#     images/train/*.jpg   labels/train/*.jpg.txt
#     images/val/*.jpg     labels/val/*.jpg.txt
# 划分命令：python wersion_train/tools/split_dataset.py --data wersion_train/configs/data_regions.yaml


names:
  0: tray_area        # 料盘区（画面左侧）
  1: assembly_area    # 装配区（画面右侧）
  2: hand             # 手（用于框出并交给跟踪器给 ID）

# 训练提示：
#   · 区域框是"固定位置的大框"，样本不必多（每类 50~200 张即可），
#     但要覆盖不同光照、手遮挡、料盘空/满状态。
#   · hand 类建议单独多标一些手部姿态，跟踪器（ByteTrack/BoT-SORT）才能稳住 ID。

path: D:\wang_robot\3_1\version_task\vesion_task\wersion_train\datasets\regions
train: images/train
val: images/val
