# 零件识别数据集（底部 / 支撑柱 / 罗盘 / 盘）
# 标注工具：X-AnyLabeling，导出格式选 YOLO Detection（矩形框）
# 用法：python vision_yolo_train/train_detect.py --data wersion_parts
#
# 类别名与采集图片前缀一致（用户确认以图片名为准）：
