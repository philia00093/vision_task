# 目录：datasets/wersion_parts/{images,labels}/{train,val,raw}
#   标注时在 datasets/annotate/parts/<类别>/images/ 看图
#   导出到 annotations/ 后跑 convert_anylabeling.py 收集标签
names:
  0: base
  1: support
  2: compass
  3: top
